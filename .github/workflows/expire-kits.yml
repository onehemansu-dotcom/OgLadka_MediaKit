# Deletes brand kits 70 days after they were made (each kit's <meta name="kit-expires">).
# Runs every day at 2:47am India time. Proof of every quote sent stays in Notion (Quotes Sent),
# and the encrypted page stays in this repo's history, readable with the key saved there.
name: Remove expired brand kits

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove kits past their expiry date
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          removed=""
          for f in k/*/index.html; do
            [ -f "$f" ] || continue
            exp=$(grep -o 'name="kit-expires" content="[0-9-]*"' "$f" | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' || true)
            if [ -n "$exp" ] && [[ ! "$exp" > "$today" ]]; then
              dir=$(dirname "$f")
              git rm -rq "$dir"
              removed="$removed $(basename "$dir")"
            fi
          done
          if [ -n "$removed" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove expired brand kits:$removed"
            git push
          else
            echo "Nothing expired on $today"
          fi
